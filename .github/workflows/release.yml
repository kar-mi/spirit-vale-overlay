name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*.*.*"

permissions:
  contents: write
  packages: read

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --verbose
      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "app-v$($package.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package.json version $($package.version). Expected $expectedTag."
          }
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Cache Neutralino binaries
        uses: actions/cache@v4
        with:
          path: apps/desktop/bin
          key: neutralino-${{ hashFiles('apps/desktop/neutralino.config.json') }}
      - name: Download Neutralino binaries
        run: bun run --filter @svoverlay/desktop update
      - name: Build portable ZIP
        run: bun run package:portable
      - name: Verify portable ZIP
        run: bun run verify:portable
      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ hashFiles('apps/desktop-electron/package.json') }}
      - name: Build Electron portable ZIP
        run: bun run package:electron
      - name: Verify Electron portable ZIP
        run: bun run verify:portable:electron
      - name: Stage versioned Windows release assets
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "dist/releases"
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          Copy-Item -LiteralPath "apps/desktop/dist/spirit-vale-overlay-windows-x64-v$($package.version).zip" `
            -Destination (Join-Path $releaseDirectory "spirit-vale-overlay-windows-x64-v$($package.version).zip") -Force
          Copy-Item -LiteralPath "apps/desktop-electron/dist/spirit-vale-overlay-electron-windows-x64-v$($package.version).zip" `
            -Destination (Join-Path $releaseDirectory "spirit-vale-overlay-electron-windows-x64-v$($package.version).zip") -Force
      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: spirit-vale-overlay-windows-x64-${{ github.run_number }}
          path: dist/releases/*.zip
          retention-days: 7
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $assets = @(
            "dist/releases/spirit-vale-overlay-windows-x64-v$($package.version).zip",
            "dist/releases/spirit-vale-overlay-electron-windows-x64-v$($package.version).zip"
          )
          gh release create $env:GITHUB_REF_NAME `
            $assets `
            --verify-tag `
            --generate-notes `
            --title "Spirit Vale Overlay $env:GITHUB_REF_NAME"
