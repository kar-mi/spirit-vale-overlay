name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Configure GitHub Packages registry
        shell: pwsh
        run: |
          '@kar-mi:registry=https://npm.pkg.github.com' | Out-File -FilePath .npmrc -Encoding ascii
          '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' | Add-Content -Path .npmrc -Encoding ascii
      - name: Install Bun dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile --verbose
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build Windows desktop app
        run: bun run build
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: spiritvale-win-x64
          path: packages/ui/dist/electrobun
          if-no-files-found: error
