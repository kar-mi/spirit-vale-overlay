name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Configure GitHub Packages registry
        shell: pwsh
        run: |
          '@kar-mi:registry=https://npm.pkg.github.com' | Out-File -FilePath .npmrc -Encoding ascii
          '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' | Add-Content -Path .npmrc -Encoding ascii
      - name: Install Bun dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile --verbose
      - name: Check dependency deduplication
        run: bun dedupe --check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Cache Neutralino binaries
        uses: actions/cache@v4
        with:
          path: apps/desktop/bin
          key: neutralino-${{ hashFiles('apps/desktop/neutralino.config.json') }}
      - name: Download Neutralino binaries
        run: bun run --filter @svoverlay/desktop update
      - name: Build Windows desktop app
        shell: pwsh
        run: |
          # Retry transient binary-download failures, but never retry the build.
          foreach ($attempt in 1..3) {
            bun run build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::build attempt $attempt failed with exit code $LASTEXITCODE"
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          }
          exit 1
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: spiritvale-win-x64
          path: apps/desktop/dist/spirit-vale-overlay
          if-no-files-found: error
