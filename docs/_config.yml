title: Spirit Vale Overlay
tagline: Passive Windows companion overlay for live combat, character, and reward data
description: >-
  Install Spirit Vale Overlay, a passive Windows x64 companion app that reads
  live combat, character, reward, and in-game overlay information without
  sending, modifying, dropping, or injecting game traffic.

url: https://kar-mi.github.io
baseurl: /spirit-vale-overlay

repository: kar-mi/spirit-vale-overlay
github_repo_url: https://github.com/kar-mi/spirit-vale-overlay
releases_latest_url: https://github.com/kar-mi/spirit-vale-overlay/releases/latest
releases_api_url: https://api.github.com/repos/kar-mi/spirit-vale-overlay/releases/latest
issues_url: https://github.com/kar-mi/spirit-vale-overlay/issues
discord_url: https://discord.gg/XtZbkspzpZ

lang: en

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: false

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - heal-attribution.md
  - WORKFLOW.MD

nav:
  - title: Features
    url: /
  - title: Guide
    url: /guide/
  - title: Install
    url: /install/
  - title: Troubleshooting
    url: /troubleshooting/
  - title: VPN issues
    url: /vpn/

guide_nav:
  - title: Overlay
    url: /guide/overlay/
    blurb: The in-game overlay, its tiles, and editing the layout.
  - title: Combat
    url: /guide/combat/
    blurb: Live DPS, combat logs, player detail, and the death log.
  - title: Boss timers
    url: /guide/boss-timers/
    blurb: World boss respawns tracked by region and channel.
  - title: Character
    url: /guide/character/
    blurb: Live character data, attributes, gear, and calculated stats.
  - title: Rewards
    url: /guide/rewards/
    blurb: Mob rewards, XP and coin tracking, and the catalog.
  - title: Build export
    url: /guide/build-export/
    blurb: Open inspected characters in the spiritvalers.com planner.
  - title: Settings
    url: /guide/settings/
    blurb: Every settings tab, from network capture to keybinds.
